[build]
  # Directory to change to before starting a build
  base = ""
  # Directory that contains the built application
  publish = "build"
  # Command to build the application
  command = "npm run build"
  # Functions directory
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "18"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"


# API Routes for campaigns
[[redirects]]
  from = "/api/campaigns/:campaignId/prospects"
  to = "/.netlify/functions/campaigns-add-prospects-to-sequence"
  status = 200

[[redirects]]
  from = "/api/campaigns"
  to = "/.netlify/functions/campaigns-list-campaigns"
  status = 200

[[redirects]]
  from = "/api/campaigns/advanced"
  to = "/.netlify/functions/campaigns-advanced"
  status = 200

[[redirects]]
  from = "/campaigns/advanced"
  to = "/.netlify/functions/campaigns-advanced"
  status = 200

[[redirects]]
  from = "/api/campaigns/debug"
  to = "/.netlify/functions/campaigns-debug"
  status = 200

[[redirects]]
  from = "/api/campaigns-get-sequence-details"
  to = "/.netlify/functions/campaigns-get-sequence-details"
  status = 200

[[redirects]]
  from = "/campaigns-get-sequence-details"
  to = "/.netlify/functions/campaigns-get-sequence-details"
  status = 200

# Redirects for React Router
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Headers for security and caching
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

